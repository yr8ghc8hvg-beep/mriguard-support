<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="0; url=https://papaetfilles.github.io/mriguard-support/">
<link rel="canonical" href="https://papaetfilles.github.io/mriguard-support/">

<title>MRI Guard — moved</title>
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#12141a; --muted:#5b616e; --line:#e6e8ec; --accent:#0a7cff; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#171a21; --ink:#eef1f6; --muted:#a2a9b6; --line:#262b34; --accent:#4c9dff; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:28px 30px;max-width:560px;text-align:center}
  .logo{font-size:34px}
  h1{font-size:1.3rem;margin:.5em 0 .3em}
  p{margin:.5em 0;color:var(--muted)}
  a{color:var(--accent);text-decoration:none;font-weight:600;word-break:break-all}
  a:hover{text-decoration:underline}
  .sep{border:0;border-top:1px solid var(--line);margin:18px 0}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🧲</div>
    <h1>MRI Guard has a new address</h1>
    <p>This page has moved. You are being forwarded automatically.</p>
    <p><a href="https://papaetfilles.github.io/mriguard-support/">https://papaetfilles.github.io/mriguard-support/</a></p>
    <hr class="sep">
    <p><strong>MRI Guard hat eine neue Adresse</strong><br>Diese Seite ist umgezogen. Du wirst automatisch weitergeleitet.</p>
  </div>
</body>
</html>
